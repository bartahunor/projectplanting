<div id="missed-popup" class="missed-popup hidden">
    <div class="missed-box">
        <button class="close-pop-btn" onclick="closeMissedPopup()">×</button>
        <h3>Kimaradt elemek</h3>
        <div class="missed-list" id="missed-list">
        </div>
    </div>
</div>


<style>
.missed-popup {
    position: fixed;
    top: 15%;
    right: 2%;        /* a jobb felső sarokhoz közel */
    z-index: 2500;
    display: flex;
    justify-content: flex-end;
}

/* maga a box */
.missed-box {
    background: #f8f9fa;      /* világos háttér */
    border-radius: 14px;
    width: 300px;
    max-height: 350px;
    padding: 15px 18px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    font-family: 'Segoe UI', 'Roboto', sans-serif;
}

/* close gomb a jobb felső sarokban */
.missed-box .close-pop-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #2e7d32;;
    border: none;
    font-size: 16px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    color: #fff;
}

.missed-box .close-pop-btn:hover {
    background: #eee;
    transform: scale(1.1);
}

/* popup címsor */
.missed-box h3 {
    margin: 0;
    text-align: center;
    font-size: 16px;
    color: #2e7d32;
}

/* scrollozható lista */
.missed-list {
    overflow-y: auto;
    max-height: 200px;  /* ha több elem van, scroll jelenik meg */
    padding: 8px;
    border: 1px solid #c8e6c9;
    border-radius: 10px;
    background-color: #fff;
}

/* lista elemek */
.missed-list .missed-item {
    padding: 5px 10px;
    margin-bottom: 5px;
    border-radius: 8px;
    background-color: #c1e6c5;
    color: #2e7d32;
    font-size: 14px;
    display: flex;
    justify-content: space-between; /* jobb oldalon mennyiség */
}
</style>

<script>
function openMissedPopup(items) {
    const popup = document.getElementById('missed-popup');
    const list = document.getElementById('missed-list');
    list.innerHTML = ''; // ürítjük

    if(items.length === 0) {
        list.innerHTML = '<div class="missed-item">Nincs kimaradt elem</div>';
    } else {
        // items egy tömb, pl. [{name:'Paradicsom', qty:3}, {name:'Hagyma', qty:1}]
        items.forEach(item => {
            const div = document.createElement('div');
            div.classList.add('missed-item');
            div.innerHTML = `<span>${item.name}</span> <span>x ${item.qty}</span>`;
            list.appendChild(div);
        });
    }

    popup.classList.remove('hidden');
}

function closeMissedPopup() {
    document.getElementById('missed-popup').classList.add('hidden');
}

const missedItems = [
    {name: 'Paradicsom', qty: 3},
    {name: 'Hagyma', qty: 1},
    {name: 'Sárgarépa', qty: 2},
    {name: 'Paprika', qty: 5},
    {name: 'Uborka', qty: 1},
    {name: 'Petrezselyem', qty: 4}
];

openMissedPopup(missedItems);
</script>
