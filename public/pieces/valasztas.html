<div class="plant-popup hidden">
  <button onclick="closePopup()" class="close-pop-btn">✕</button>
  <div class="plant-box">
    <h3>Növény hozzáadása</h3>

    <div id="plant-alert" class="alert hidden"></div>

    <label>Válassz növényt:</label>
    <select id="plant-select">

    </select>

    <label>Darabszám:</label>
    <input type="number" id="plant-quantity" min="1" value="1">

    <!-- itt lesz a hozzáadott növények listája -->
    <div id="plant-list" class="plant-list"></div>

    <div style="margin-top: 15px; text-align: center;">
      <button onclick="addPlant()">Hozzáadás</button>
      <button onclick="closePopupAndDisable()">OK</button>
    </div>
  </div>
</div>
