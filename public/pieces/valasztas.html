<style>
.plant-popup {
    position: fixed;
    inset: 0;
    background-color: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    backdrop-filter: blur(4px);
}

.plant-box {
    background-color: #fff;
    padding: 30px 40px;
    border-radius: 20px;
    width: 350px;
    max-width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 15px;
    font-family: 'Segoe UI', 'Roboto', sans-serif;
}

.plant-box h3 {
    margin: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
}

.plant-box select, 
.plant-box input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

.plant-box button {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background-color: #4caf50;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.plant-box button:hover {
    background-color: #388e3c;
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
}

.alert {
    background-color: #ffebee;
    color: #c62828;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    text-align: center;
}

.plant-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 0;
}

.plant-item {
    background-color: #e8f5e9;
    color: #2e7d32;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
}

</style>

<div class="plant-popup hidden">
  <div class="plant-box">
    <h3>Növény hozzáadása</h3>

    <div id="plant-alert" class="alert hidden"></div>

    <label>Válassz növényt:</label>
    <select id="plant-select">
      <option value="">-- válassz --</option>
      <option value="Paradicsom">🍅 Paradicsom</option>
      <option value="Saláta">🥬 Saláta</option>
      <option value="Bazsalikom">🌿 Bazsalikom</option>
      <option value="Paprika">🌶 Paprika</option>
    </select>

    <label>Darabszám:</label>
    <input type="number" id="plant-quantity" min="1" value="1">

    <!-- itt lesz a hozzáadott növények listája -->
    <div id="plant-list" class="plant-list"></div>

    <div style="margin-top: 15px; text-align: center;">
      <button onclick="addPlant()">Hozzáadás</button>
      <button onclick="closePlantPopup()">OK</button>
    </div>
  </div>
</div>

<script>
let selectedPlants = []; // ide kerülnek a hozzáadott növények

function openPlantPopup() {
    document.querySelector(".plant-popup").classList.remove("hidden");
    renderPlantList();
}

function closePlantPopup() {
    document.querySelector(".plant-popup").classList.add("hidden");
    clearPlantAlert();
    selectedPlants = []; // törlés, ha új popup nyílik
    renderPlantList();
}

function showPlantAlert(message) {
    const alertDiv = document.getElementById("plant-alert");
    alertDiv.innerText = message;
    alertDiv.style.display = "block";

    setTimeout(() => {
        alertDiv.style.display = "none";
    }, 3000);
}

function clearPlantAlert() {
    const alertDiv = document.getElementById("plant-alert");
    alertDiv.style.display = "none";
}

// növény hozzáadása a listához
function addPlant() {
    const plantSelect = document.getElementById("plant-select");
    const quantityInput = document.getElementById("plant-quantity");

    const plantName = plantSelect.value;
    const quantity = Number(quantityInput.value);

    if (!plantName) {
        showPlantAlert("Válassz növényt!");
        return;
    }
    if (quantity < 1) {
        showPlantAlert("Adj meg legalább 1 darabot!");
        return;
    }

    // hozzáadjuk a selectedPlants tömbhöz
    selectedPlants.push({ name: plantName, quantity });
    renderPlantList();

    // reset input
    plantSelect.value = "";
    quantityInput.value = 1;
}

// megjelenítés a popupban
function renderPlantList() {
    const listDiv = document.getElementById("plant-list");
    listDiv.innerHTML = "";

    selectedPlants.forEach(plant => {
        const item = document.createElement("div");
        item.classList.add("plant-item");
        item.innerText = `${plant.name} x${plant.quantity}`;
        listDiv.appendChild(item);
    });
}
</script>
