<div class="agyas-popup">
    <div class="box">

        <!-- 1–5 választás -->
        <div id="step1">
            <h3>Hány ágyást szeretnél megadni?</h3>
            <div class="counter">
                <button onclick="changeCount(-1)">◀</button>
                <span id="count">1</span>
                <button onclick="changeCount(1)">▶</button>
            </div>
            <button onclick="start()">Tovább</button>
        </div>

        <!-- Területek kérdezése -->
        <div id="step2" class="hidden">
            <h3 id="title"></h3>

            <label>Alak:</label>
            <select id="shape" onchange="updateInputs()">
                <option value="">-- válassz --</option>
                <option value="circle">Kör</option>
                <option value="square">Négyzet</option>
                <option value="rectangle">Téglalap</option>
            </select>

            <div id="inputs"></div>

            <button onclick="next()">Következő</button>
        </div>

        <!-- Vége -->
        <div id="done" class="hidden">
            <h3>Kész 🎉</h3>
            <p>Minden terület meg lett adva.</p>
            <pre id="result"></pre>
        </div>

    </div>

</div>
