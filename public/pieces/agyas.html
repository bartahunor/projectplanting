<style>
            body {
            font-family: Arial, sans-serif;
            background: #f2f7f2;
            padding: 30px;
        }
        

        .box {
            background: white;
            padding: 20px;
            max-width: 400px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        button {
            padding: 8px 14px;
            margin: 6px;
            border: none;
            border-radius: 6px;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #388e3c;
        }

        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
        }

        .hidden {
            display: none;
        }

        .counter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 20px;
        }
</style>


<div class="agyas-popup">
    <div class="box">

    <!-- 1–5 választás -->
    <div id="step1">
        <h3>Hány ágyást szeretnél megadni?</h3>
        <div class="counter">
            <button onclick="changeCount(-1)">◀</button>
            <span id="count">1</span>
            <button onclick="changeCount(1)">▶</button>
        </div>
        <button onclick="start()">Tovább</button>
    </div>

    <!-- Területek kérdezése -->
    <div id="step2" class="hidden">
        <h3 id="title"></h3>

        <label>Alak:</label>
        <select id="shape" onchange="updateInputs()">
            <option value="">-- válassz --</option>
            <option value="circle">Kör</option>
            <option value="square">Négyzet</option>
            <option value="rectangle">Téglalap</option>
        </select>

        <div id="inputs"></div>

        <button onclick="next()">Következő</button>
    </div>

    <!-- Vége -->
    <div id="done" class="hidden">
        <h3>Kész 🎉</h3>
        <p>Minden terület meg lett adva.</p>
        <pre id="result"></pre>
    </div>

</div>

</div>
<script>
    let count = 1;
    let current = 1;
    let data = [];

    function changeCount(val) {
        count = Math.min(5, Math.max(1, count + val));
        document.getElementById("count").innerText = count;
    }

    function start() {
        document.getElementById("step1").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");
        showQuestion();
    }

    function showQuestion() {
        document.getElementById("title").innerText =
            current + ". terület megadása";
        document.getElementById("shape").value = "";
        document.getElementById("inputs").innerHTML = "";
    }

    function updateInputs() {
        const shape = document.getElementById("shape").value;
        const div = document.getElementById("inputs");
        div.innerHTML = "";

        if (shape === "circle") {
            div.innerHTML = `
                <label>Sugár:</label>
                <input type="number" id="a">
            `;
        } else if (shape === "square") {
            div.innerHTML = `
                <label>Oldalhossz:</label>
                <input type="number" id="a">
            `;
        } else if (shape === "rectangle") {
            div.innerHTML = `
                <label>Szélesség:</label>
                <input type="number" id="a">
                <label>Magasság:</label>
                <input type="number" id="b">
            `;
        }
    }

    function next() {
        const shape = document.getElementById("shape").value;
        if (!shape) return alert("Válassz alakot!");

        const a = document.getElementById("a")?.value;
        const b = document.getElementById("b")?.value;

        data.push({ shape, a, b });

        if (current < count) {
            current++;
            showQuestion();
        } else {
            document.getElementById("step2").classList.add("hidden");
            document.getElementById("done").classList.remove("hidden");
            document.getElementById("result").innerText =
                JSON.stringify(data, null, 2);
        }
    }
</script>
