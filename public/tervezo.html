<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="tervezo.css">
    <title>Garden Architect</title>
</head>
<body>
    <div class="top-left-buttons">
        <button id="agyas-btn" onclick="openAgyasPopup()">ADD MEG A FÖLDED TERÜLETÉT</button>
        <button id="valasztas-btn" onclick="openValasztasPopup()">ADD MEG A NÖVÉNYEKET</button>
        <button id="plant-now-btn" onclick="plantNow()">ÜLTESD BE!</button>
        <div class="email-box">
            <input type="text" id="receiver-name" placeholder="Címzett neve">
            <input type="email" id="receiver-email" placeholder="Címzett e-mail címe">
            <button type="button" class="email-send-btn" onclick="kuldesEmail()" disabled>
                KÜLDÉS E-MAILBEN
            </button>
        </div>
    </div>

    <button id="mini-home-btn" onclick="goHome()"><img src="pictures/undo.png" alt=""></button>

    <div id="popup" class="popup"></div>
    
    <div id="beds" class="beds"></div>

    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>


    <script src="main.js"></script>
    
</body>
</html>
